<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><line x1="480" y1="300" x2="810" y2="300" stroke="#111" stroke-width="3" marker-end="url(#ab)"/><text x="825" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="start" dominant-baseline="middle">x : droite</text><line x1="480" y1="300" x2="480" y2="50" stroke="#111" stroke-width="3" marker-end="url(#ab)"/><text x="480" y="25" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="middle" dominant-baseline="middle">y : haut</text><line x1="480" y1="300" x2="260" y2="400" stroke="#111" stroke-width="3" marker-end="url(#ab)"/><text x="240" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#111" text-anchor="end" dominant-baseline="middle">z : vers nous</text><text x="900" y="150" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#333" text-anchor="start" dominant-baseline="middle" font-style="italic">Unités : au choix (ici, des mètres)</text><text x="900" y="195" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#333" text-anchor="start" dominant-baseline="middle" font-style="italic">Angles : en radians</text><text x="900" y="240" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#333" text-anchor="start" dominant-baseline="middle" font-style="italic">(un tour = 2π ≈ 6,28)</text></svg>
