<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi CSS 05 : la carte qui se retourne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Devinettes</h1>
        <div class="cards">
            <button class="card">
                <span class="card-inner">
                    <span class="face front">Qu'est-ce qui a des dents mais ne mange pas ?</span>
                    <span class="face back">Un peigne 🪮</span>
                </span>
            </button>
            <button class="card">
                <span class="card-inner">
                    <span class="face front">Plus j'ai de gardiens, moins je suis gardé. Qui suis-je ?</span>
                    <span class="face back">Un secret 🤫</span>
                </span>
            </button>
            <button class="card">
                <span class="card-inner">
                    <span class="face front">Qu'est-ce qui monte et ne redescend jamais ?</span>
                    <span class="face back">L'âge 🎂</span>
                </span>
            </button>
        </div>
    </main>

</body>
</html>
