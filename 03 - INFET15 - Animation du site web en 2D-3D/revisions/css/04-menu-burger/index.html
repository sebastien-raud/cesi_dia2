<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi CSS 04 : le menu burger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <button class="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <span class="logo">Mon site</span>

        <nav id="menu" class="menu" aria-label="Menu principal">
            <a href="#">Accueil</a>
            <a href="#">Projets</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <p>Clique sur le burger, en haut à gauche.</p>
    </main>

    <!-- le JavaScript est fourni : il ajoute ou retire la classe menu-open sur l'en-tête -->
    <script>
        const header = document.querySelector('.header');
        const burger = document.querySelector('.burger');
        burger.addEventListener('click', () => {
            const isOpen = header.classList.toggle('menu-open');
            burger.setAttribute('aria-expanded', isOpen);
        });
    </script>

</body>
</html>
