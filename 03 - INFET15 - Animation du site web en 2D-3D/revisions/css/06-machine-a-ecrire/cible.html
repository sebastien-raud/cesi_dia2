<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi CSS 06 : la machine à écrire (résultat attendu)</title>
    <link rel="stylesheet" href="correction.css">
    <style>.target-banner { position: fixed; bottom: 0; left: 0; right: 0; padding: .4rem; text-align: center; font: bold .9rem sans-serif; color: #fff; background: #B10DC9; z-index: 10; }</style>
</head>
<body>
    <p class="target-banner">Résultat attendu</p>

    <main>
        <!-- --chars : le nombre de caractères du texte (espaces et ponctuation compris) -->
        <h1 class="typing" style="--chars: 26">Bonjour, je suis un robot.</h1>
        <p>Tout est en CSS : pas une ligne de JavaScript.</p>
    </main>

</body>
</html>
