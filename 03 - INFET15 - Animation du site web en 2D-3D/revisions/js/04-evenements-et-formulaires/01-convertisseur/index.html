<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de températures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <h1>🌡️ Convertisseur de températures</h1>

        <div class="content">
            <form>
                <label for="celsius">Degrés Celsius (°C)</label>
                <input type="number" id="celsius" step="0.1">

                <label for="fahrenheit">Degrés Fahrenheit (°F)</label>
                <input type="number" id="fahrenheit" step="0.1">
            </form>

            <div class="thermometer">
                <div class="mercury"></div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
