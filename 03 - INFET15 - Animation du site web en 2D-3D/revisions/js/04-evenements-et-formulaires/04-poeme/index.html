<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le poème dans le désordre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <h1>Le poème dans le désordre</h1>
        <p>Clique sur les vers dans le bon ordre pour reconstituer le début du poème.</p>

        <div class="verses">
            <button class="verse" data-order="8">Bah t'as raison mon pote</button>
            <button class="verse" data-order="5">Ça fait la neuvième qu'on m'pique ça fait la onzième que j'vole</button>
            <button class="verse" data-order="7">Qui c'est qui dit qu'c'est pas vrai ? Toi ?</button>
            <button class="verse" data-order="3">Il faudrait pas qu'on profite que j'suis en train d'vendre ma camelote</button>
            <button class="verse" data-order="2">J'ai laissé la porte ouverte pour avoir un œil sur elle</button>
            <button class="verse" data-order="4">Pour s'débiner sur ma chiotte j'ai beau mettre des antivols</button>
            <button class="verse" data-order="6">Quoi ?</button>
            <button class="verse" data-order="1">J'ai garé ma mobylette devant l'entrée des artistes</button>
        </div>

        <p id="poem"></p>

        <p id="message"></p>

        <button id="restart">Recommencer</button>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
